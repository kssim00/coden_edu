<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>스크래치 2.0 작업 화면</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
#host{position:absolute;inset:0}#host ruffle-player{width:100%;height:100%;display:block}
#msg{position:absolute;inset:0;display:grid;place-items:center;font:15px/1.6 "Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#06403a;background:#e6f7f4;text-align:center;padding:20px}
#msg[hidden]{display:none}
</style>
<script>
/* 스크래치 2.0 오프라인 편집기(Flash)를 Ruffle로 띄워요.
   부모 창(index.html / exam.html)과는 3.0 편집기 때와 같은 약속으로 대화합니다.
   - 준비되면 {type:"scratch-ready"}
   - {type:"load", id, buf}  : sb2(zip) 바이트를 편집기에 열기
   - {type:"export", id}     : 지금 편집기 내용을 sb2(zip) 바이트로 돌려주기 */
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
  autoplay:"on", unmuteOverlay:"hidden", logLevel:"warn", quality:"high", letterbox:"on", polyfills:false,
  deviceFontRenderer:"embedded",
  fontSources:["fonts/scratch.ttf","fonts/helvetica.ttf","fonts/marker.ttf","fonts/mystery.ttf","fonts/gloria.ttf","fonts/donegal.ttf"],
  defaultFonts:{sans:["Helvetica","Scratch"],serif:["Donegal","Helvetica"],typewriter:["Scratch"]}
};
</script>
<script src="ruffle/ruffle.js"></script>
<script src="snapshot-codec.js"></script>
</head>
<body>
<div id="host"></div>
<div id="msg">스크래치 2.0 편집기를 준비하고 있어요…</div>
<script>
let api = null, baseline = null, pendingExport = null;
const msg = document.getElementById("msg");
const sleep = ms => new Promise(r => setTimeout(r, ms));
function toB64(bytes){ let s = ""; for(let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
function fromB64(t){ const b = atob(t.replace(/\s/g, "")), u = new Uint8Array(b.length); for(let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }

/* 편집기(swf)가 부르는 함수들 */
window.JSwillDownload = () => true;
window.JSloadID = () => {};
window.JSeditorReady = () => {};
window.gotZipBase64 = c => { if(api) api.callExternalInterface("ASopenProjectFromData", c); };
window.JSdownloadSB2 = (encoded, filename) => {            // 편집기 [파일 > 저장] 은 sb2 내려받기로
  const a = document.createElement("a"); a.href = "data:application/octet-stream;base64," + encoded; a.download = filename || "scratch-project.sb2";
  document.body.appendChild(a); a.click(); a.remove();
};
window.JSreceiveProjectJSON = text => { const p = pendingExport; if(!p) return; pendingExport = null; clearTimeout(p.t); p.resolve({json: text}); };
window.JSreceiveProjectData = encoded => { const p = pendingExport; if(!p) return; pendingExport = null; clearTimeout(p.t); p.resolve({zip: encoded}); };

async function boot(){
  const swf = new URL("editor/scratch-scratch2-editor.swf", location.href);
  try{ localStorage.setItem(swf.hostname + swf.pathname + "/Scratch", "AL8AAAAhVENTTwAEAAAAAAAHU2NyYXRjaAAAAAMJbGFuZwYFa28A"); }catch(e){}   // 한국어
  const player = window.RufflePlayer.newest().createPlayer();
  document.getElementById("host").appendChild(player);
  const loaded = new Promise(r => player.addEventListener("loadeddata", r, {once:true}));
  api = player.ruffle();
  await api.load({url: "editor/scratch-scratch2-editor.swf?v=20261123", allowScriptAccess: true,
                  base: new URL("editor/locale-ko-default17/", location.href).href, parameters: {}});
  await Promise.race([loaded, sleep(12000)]);
  await sleep(800);
  try{ api.callExternalInterface("ASsetSmallStage", true); }catch(e){}
  msg.hidden = true;
  parent.postMessage({type: "scratch-ready"}, "*");
}

async function openProject(bytes){
  if(bytes[0] === 123){                                   // 예전 형식(JSON 스냅샷)이면 zip으로 되돌려요
    bytes = await SnapshotCodec.restore(bytes, baseline || {assets: {}});
  }
  baseline = await SnapshotCodec.baseline(bytes);
  api.callExternalInterface("ASopenProjectFromData", toB64(bytes));
  const deadline = Date.now() + 20000;
  await sleep(50);
  while(api.callExternalInterface("ASisProjectLoading")){
    if(Date.now() > deadline) throw new Error("프로젝트를 여는 시간이 초과되었어요.");
    await sleep(30);
  }
}

function exportProject(){
  if(pendingExport) return Promise.reject(new Error("편집기 내용을 가져오는 중이에요."));
  return new Promise((resolve, reject) => {
    const p = {resolve, reject, t: setTimeout(() => { if(pendingExport === p){ pendingExport = null; reject(new Error("편집기에서 프로젝트를 가져오지 못했어요.")); } }, 15000)};
    pendingExport = p;
    try{ api.callExternalInterface("ASexportProjectJSON", baseline ? baseline.known : "{}"); }
    catch(e){ pendingExport = null; clearTimeout(p.t); reject(e); }
  }).then(async r => {
    if(r.zip) return fromB64(r.zip);
    return SnapshotCodec.restore(new TextEncoder().encode(r.json), baseline || {assets: {}});
  });
}

/* 부모 창의 요청은 한 번에 하나씩 처리 */
let chain = Promise.resolve();
window.addEventListener("message", e => {
  if(e.source !== parent) return;
  const m = e.data || {};
  if(m.type !== "load" && m.type !== "export") return;
  chain = chain.then(async () => {
    try{
      if(!api) throw new Error("편집기가 아직 준비되지 않았어요.");
      if(m.type === "load"){ await openProject(new Uint8Array(m.buf)); parent.postMessage({type: "loaded", id: m.id}, "*"); }
      else{
        const u8 = await exportProject();
        const buf = u8.buffer.slice(u8.byteOffset, u8.byteOffset + u8.byteLength);
        parent.postMessage({type: "exported", id: m.id, buf}, "*", [buf]);
      }
    }catch(err){ parent.postMessage({type: "error", id: m.id, message: (err && err.message) || String(err)}, "*"); }
  });
});

boot().catch(err => { console.error(err); msg.hidden = false; msg.textContent = "스크래치 2.0 편집기를 불러오지 못했어요. 새로고침해 주세요."; });
</script>
</body>
</html>
