<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COS 엔트리 연습실</title>
<style>
  :root{
    --bg:#f4f6fb; --panel:#fff; --ink:#1f2540; --muted:#6b7394;
    --brand:#3b5bdb; --brand-soft:#e7ecff; --line:#dde2f0;
    --ok:#2f9e44; --warn:#f08c00; --bad:#e03131;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:8px}
  button:hover{background:var(--brand-soft)}
  button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  button.primary:hover{filter:brightness(1.08)}
  select,input[type=number]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}

  header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
  .logo{font-weight:800;letter-spacing:.3px}
  .logo small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
  .tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:10px}
  .tabs button{border:none;background:transparent;padding:6px 14px}
  .tabs button.on{background:var(--brand);color:#fff}
  .timer{margin-left:auto;display:flex;align-items:center;gap:8px}
  .time{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800;min-width:76px;text-align:center}
  .time.low{color:var(--bad)}

  .qbar{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .qnums{display:flex;gap:6px;flex-wrap:wrap}
  .qnums button{min-width:40px;position:relative}
  .qnums button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .qnums button .dot{position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;border:2px solid #fff;background:var(--line)}
  .qnums button .dot.doing{background:var(--warn)}
  .qnums button .dot.done{background:var(--ok)}
  .spacer{flex:1}

  main{flex:1;display:flex;min-height:0}
  .pane{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--panel);margin:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .pane h2{margin:0;font-size:14px;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .pane h2 .spacer{flex:1}
  .pane h2 button{padding:3px 10px;font-size:12px;font-weight:500}
  .view{flex:1;min-height:0;position:relative}
  .view iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted);line-height:1.6}
  .empty b{color:var(--ink)}

  .notes{border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;align-items:flex-start}
  .notes textarea{flex:1;height:56px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
  .notes label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

  @media (max-width:900px){ main{flex-direction:column} .pane{min-height:60vh} }
</style>
</head>
<body>

<header>
  <div class="logo">COS ENTRY LAB<small>엔트리 급수별 실기 연습 · 비공식</small></div>
  <div class="tabs" id="gradeTabs"></div>
  <div class="timer">
    <span class="time" id="time">40:00</span>
    <button class="primary" id="btnStart">시작</button>
    <button id="btnReset">초기화</button>
  </div>
</header>

<div class="qbar">
  <label>세트
    <select id="setSel"></select>
  </label>
  <div class="qnums" id="qnums"></div>
  <span class="spacer"></span>
  <button id="btnPrev">← 이전</button>
  <button id="btnNext">다음 →</button>
</div>

<main>
  <section class="pane">
    <h2>문제
      <span class="spacer"></span>
      <a href="https://imagesisa.ybmsisa.com/platform/www_ybmit_com/down/cos/COS%203%EA%B8%89%20Entry.zip" target="_blank" rel="noopener"><button>YBMIT 3급 샘플 ZIP ↗</button></a>
      <button id="btnPdf">PDF 선택</button>
      <input type="file" id="pdfFile" accept="application/pdf" hidden>
    </h2>
    <div class="view" id="pdfView">
      <div class="empty" id="pdfEmpty">
        <div><b>문제 PDF를 불러오세요</b></div>
        <div>위의 <b>PDF 선택</b>으로 문제 PDF를 열면<br>이 영역에서 보면서 풀 수 있어요.</div>
        <div style="font-size:12px">※ PDF는 이 브라우저 탭에서만 유지돼요(새로고침하면 다시 선택).</div>
      </div>
    </div>
    <div class="notes">
      <label>상태
        <select id="status">
          <option value="">미풀이</option>
          <option value="doing">푸는 중</option>
          <option value="done">완료</option>
        </select>
      </label>
      <textarea id="memo" placeholder="이 문제 메모 (자동 저장)"></textarea>
    </div>
  </section>

  <section class="pane">
    <h2>엔트리 편집 · 실행
      <span class="spacer"></span>
      <a href="https://playentry.org/ws/new" target="_blank" rel="noopener"><button>새 탭으로 열기 ↗</button></a>
    </h2>
    <div class="view" id="entryView">
      <iframe id="entryFrame" src="https://playentry.org/ws/new" title="엔트리 작업 화면"></iframe>
      <div class="empty" id="entryFallback" style="display:none">
        <div><b>이 화면에서 엔트리가 열리지 않아요</b></div>
        <div>브라우저 설정이나 사이트 정책으로 막혔을 수 있어요.<br>위의 <b>새 탭으로 열기</b>로 작업하세요.</div>
      </div>
    </div>
  </section>
</main>

<script>
/* ===== 설정: 여기서 급수·시간·세트·문제 수를 조정하세요 ===== */
const CONFIG = {
  grades: {
    "3급": { minutes: 40, sets: ["샘플 1"], problems: 3 },
    "2급": { minutes: 50, sets: ["샘플 1"], problems: 3 },
    "1급": { minutes: 50, sets: ["샘플 1"], problems: 3 }
  }
};

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem("cosLab:"+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("cosLab:"+k, JSON.stringify(v)); }catch(e){} }
};

let state = {
  grade: store.get("grade", "3급"),
  set: 0,
  q: 1,
  remain: 0,
  timerId: null,
  pdfUrl: null
};
if(!CONFIG.grades[state.grade]) state.grade = "3급";

const key = () => `${state.grade}|${state.set}|${state.q}`;

function renderTabs(){
  const box = $("gradeTabs"); box.innerHTML = "";
  Object.keys(CONFIG.grades).forEach(g=>{
    const b = document.createElement("button");
    b.textContent = "Entry " + g;
    if(g===state.grade) b.className = "on";
    b.onclick = ()=>{ state.grade=g; state.set=0; state.q=1; store.set("grade", g); resetTimer(); renderAll(); };
    box.appendChild(b);
  });
}
function renderSets(){
  const sel = $("setSel"); sel.innerHTML = "";
  CONFIG.grades[state.grade].sets.forEach((s,i)=>{
    const o = document.createElement("option"); o.value=i; o.textContent=s; sel.appendChild(o);
  });
  sel.value = state.set;
  sel.onchange = ()=>{ state.set = +sel.value; state.q = 1; renderAll(); };
}
function renderQnums(){
  const box = $("qnums"); box.innerHTML = "";
  const n = CONFIG.grades[state.grade].problems;
  for(let i=1;i<=n;i++){
    const b = document.createElement("button");
    b.textContent = i;
    if(i===state.q) b.className = "on";
    const st = store.get(`st|${state.grade}|${state.set}|${i}`, "");
    const dot = document.createElement("span");
    dot.className = "dot " + st; b.appendChild(dot);
    b.onclick = ()=>{ state.q = i; renderAll(); };
    box.appendChild(b);
  }
}
function renderNotes(){
  $("status").value = store.get("st|"+key(), "");
  $("memo").value = store.get("memo|"+key(), "");
}
function renderAll(){
  renderTabs(); renderSets(); renderQnums(); renderNotes();
  if(state.remain===0 && !state.timerId) showTime(CONFIG.grades[state.grade].minutes*60);
}

/* 이동 */
$("btnPrev").onclick = ()=>{ if(state.q>1){ state.q--; renderAll(); } };
$("btnNext").onclick = ()=>{ if(state.q<CONFIG.grades[state.grade].problems){ state.q++; renderAll(); } };

/* 메모·상태 자동 저장 */
$("memo").addEventListener("input", e=> store.set("memo|"+key(), e.target.value));
$("status").addEventListener("change", e=>{ store.set("st|"+key(), e.target.value); renderQnums(); });

/* 타이머 */
function showTime(sec){
  const m = String(Math.floor(sec/60)).padStart(2,"0");
  const s = String(sec%60).padStart(2,"0");
  $("time").textContent = `${m}:${s}`;
  $("time").classList.toggle("low", sec<=300 && sec>0 );
}
function resetTimer(){
  clearInterval(state.timerId); state.timerId = null;
  state.remain = 0;
  $("btnStart").textContent = "시작";
  showTime(CONFIG.grades[state.grade].minutes*60);
}
$("btnStart").onclick = ()=>{
  if(state.timerId){                       // 일시정지
    clearInterval(state.timerId); state.timerId = null;
    $("btnStart").textContent = "계속"; return;
  }
  if(state.remain<=0) state.remain = CONFIG.grades[state.grade].minutes*60;
  $("btnStart").textContent = "일시정지";
  state.timerId = setInterval(()=>{
    state.remain--; showTime(state.remain);
    if(state.remain<=0){
      clearInterval(state.timerId); state.timerId = null;
      $("btnStart").textContent = "시작";
      alert("시간이 끝났어요! 작업한 ENT 파일을 저장하세요.");
    }
  },1000);
};
$("btnReset").onclick = resetTimer;

/* PDF 열기 */
$("btnPdf").onclick = ()=> $("pdfFile").click();
$("pdfFile").onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  if(state.pdfUrl) URL.revokeObjectURL(state.pdfUrl);
  state.pdfUrl = URL.createObjectURL(f);
  const old = $("pdfView").querySelector("iframe"); if(old) old.remove();
  $("pdfEmpty").style.display = "none";
  const fr = document.createElement("iframe");
  fr.src = state.pdfUrl; fr.title = "문제 PDF";
  $("pdfView").appendChild(fr);
};

/* 엔트리 임베드 실패 대비 */
$("entryFrame").addEventListener("load", ()=>{});
setTimeout(()=>{
  // 임베드 가능 여부를 정확히 알 수 없어, 8초 뒤 안내만 노출(프레임은 유지)
  const tip = document.createElement("div");
  tip.style.cssText = "position:absolute;left:8px;bottom:8px;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 8px;color:var(--muted)";
  tip.textContent = "화면이 비어 있으면 위의 '새 탭으로 열기'를 사용하세요.";
  $("entryView").appendChild(tip);
},8000);

renderAll();
</script>
</body>
</html>
